<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Взаимка — база чатов</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1f7;--ink:#101b34;--mute:#5d6a85;--acc:#2b50f0;--hi:#ffc933;--card:#fff;--line:#d9e0ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,sans-serif}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2{font-family:Unbounded,Onest,sans-serif;margin:0;letter-spacing:-.02em}
.hero{padding:56px 0 28px}.hero h1{font-size:clamp(34px,6vw,64px);font-weight:800;line-height:1.02;max-width:12em}
.hero p{color:var(--mute);margin:14px 0 0;font-size:18px}.hero b{color:var(--ink)}
nav{display:flex;justify-content:space-between;padding:18px 0;font-weight:600}nav a{text-decoration:none;color:var(--mute)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar input{flex:1;min-width:200px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.s{padding:5px 12px;font-size:14px}.btn.d{background:#fff;color:#c4261d;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.top{display:flex;gap:14px;align-items:center}.av{width:52px;height:52px;border-radius:14px;color:#fff;display:grid;place-items:center;font:800 22px Unbounded;flex:none}
.card h3{margin:0;font-size:17px;line-height:1.25;overflow-wrap:anywhere}.meta{color:var(--mute);font-size:14px}
.about{color:var(--mute);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.foot{display:flex;justify-content:space-between;align-items:center}.n{font:600 20px Unbounded}
.up{background:var(--hi);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600;margin-left:8px}
.empty{padding:60px 0;text-align:center;color:var(--mute)}
.tabs{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pan{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.kpi b{display:block;font:600 24px Unbounded}.kpi span{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}.st{border-radius:6px;padding:1px 8px;background:var(--bg);font-size:12px}.st.done{background:#d5f5e3}.st.error,.st.dead{background:#fde0dd}.st.new,.st.scanning{background:#fff1c2}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row>*{flex:1;min-width:160px}.row>.btn{flex:none}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}pre{margin:0;font:13px/1.6 ui-monospace,monospace;white-space:pre-wrap}
.msg{color:var(--mute);font-size:14px;min-height:20px}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style></head><body><div class="w" id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{'Content-Type':'application/json'},body:o.body&&JSON.stringify(o.body)});
 if(r.status===401)throw 401;const j=await r.json().catch(()=>({}));if(!r.ok)throw j.detail||r.statusText;return j};
const fmt=n=>n==null?'—':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?Math.round(n/1e3)+'K':n>=1e3?(n/1e3).toFixed(1)+'K':n;
const COL=['#2b50f0','#e4572e','#12a594','#8e44ec','#c97f00'];
const av=t=>`<div class="av" style="background:${COL[[...t].reduce((a,c)=>a+c.charCodeAt(0),0)%5]}">${esc([...t][0]||'?')}</div>`;
const KIND={group:'группа',channel:'канал',private:'закрытый',forum:'форум'};
const date=d=>d?new Date(d).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';

/* ---------- публичная часть ---------- */
let st={q:'',sort:'members',off:0,vz:0};
async function pub(){
 const s=await api('/api/stats');
 $('#app').innerHTML=`<nav><b>Взаимка</b><a href="#admin">Админка</a></nav>
 <section class="hero"><h1>Чаты для взаимных подписок</h1><p>В базе <b>${s.chats}</b> чатов, в них <b>${fmt(+s.members)}</b> участников. Список пополняется сам.</p></section>
 <div class="bar"><input id="q" type="search" placeholder="Поиск по названию и описанию" value="${esc(st.q)}">
 <select id="sort"><option value="members">Больше участников</option><option value="growth">Быстрее растут</option><option value="seen">Чаще упоминают</option><option value="new">Недавно найдены</option></select><label style="display:flex;align-items:center;gap:6px;color:var(--ink);margin:0;font-size:15px"><input type="checkbox" id="vz" style="min-width:0;flex:none" ${st.vz?'checked':''}> Только ВЗ</label></div>
 <div class="grid" id="g"></div><div class="row" style="margin-top:20px"><button class="btn g" id="more" hidden>Показать ещё</button></div>`;
 $('#sort').value=st.sort;let t;$('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{st.q=e.target.value;st.off=0;load()},300)};
 $('#vz').onchange=e=>{st.vz=e.target.checked?1:0;st.off=0;load()};$('#sort').onchange=e=>{st.sort=e.target.value;st.off=0;load()};$('#more').onclick=()=>{st.off+=48;load(true)};load();
}
async function load(app){
 const r=await api(`/api/chats?q=${encodeURIComponent(st.q)}&sort=${st.sort}&offset=${st.off}&vz=${st.vz}`);
 const h=r.map(c=>`<article class="card"><div class="top">${av(c.title)}<div><h3>${esc(c.title)}</h3><div class="meta">${KIND[c.kind]||'чат'}${c.vz?' · ВЗ':''}${c.username?' · @'+esc(c.username):''}</div></div></div>
 <div class="about">${esc(c.about)||'Описания нет'}</div>
 <div class="foot"><div><span class="n">${fmt(c.members)}</span>${c.growth>0?`<span class="up">+${fmt(c.growth)} за неделю</span>`:''}</div><a class="btn s" href="${esc(c.link)}" target="_blank" rel="noopener">Открыть</a></div></article>`).join('');
 $('#g').innerHTML=(app?$('#g').innerHTML:'')+h;
 if(!app&&!r.length)$('#g').innerHTML='<div class="empty">Пока ничего не найдено</div>';
 $('#more').hidden=r.length<48;
}

/* ---------- админка ---------- */
let tab='chats',flt='';
async function adm(){
 let o;try{o=await api('/api/admin/overview')}catch(e){return login()}
 const c=o.counts,n=k=>c[k]||0;
 $('#app').innerHTML=`<nav><b>Админка</b><a href="#">На сайт</a></nav>
 <div class="kpis"><div class="kpi"><b>${n('done')+n('private')}</b><span>просканировано</span></div><div class="kpi"><b>${n('new')+n('scanning')}</b><span>в очереди</span></div>
 <div class="kpi"><b>${n('dead')+n('error')}</b><span>недоступны</span></div><div class="kpi"><b>${o.sessions.filter(s=>s.status=='active').length}/${o.sessions.length}</b><span>аккаунтов активно</span></div></div>
 <div class="tabs">${[['chats','Чаты'],['acc','Аккаунты'],['set','Настройки'],['log','Лог']].map(([k,l])=>`<button class="${tab==k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div><div id="tb"></div>`;
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;adm()});
 ({chats:tChats,acc:()=>tAcc(o),set:()=>tSet(o),log:()=>{$('#tb').innerHTML=`<div class="pan"><pre>${esc(o.log.join('\n'))||'Пока пусто'}</pre></div>`}})[tab]();
}
function login(){
 $('#app').innerHTML=`<nav><b>Вход</b><a href="#">На сайт</a></nav><div class="pan" style="max-width:360px"><label>Пароль администратора</label><input id="p" type="password" style="width:100%"><p class="msg" id="m"></p><button class="btn" id="go">Войти</button></div>`;
 const go=async()=>{try{await api('/api/login',{method:'POST',body:{password:$('#p').value}});adm()}catch(e){$('#m').textContent=e}};
 $('#go').onclick=go;$('#p').onkeydown=e=>e.key=='Enter'&&go();$('#p').focus();
}
async function tChats(){
 $('#tb').innerHTML=`<div class="pan"><label>Добавить чаты: вставьте одну или несколько ссылок t.me</label><textarea id="ln" rows="3" style="width:100%" placeholder="https://t.me/lime_chat2"></textarea>
 <div class="row" style="margin-top:10px"><button class="btn" id="add">Добавить и сканировать</button><button class="btn g" id="ds">Искать новые чаты сейчас</button><span class="msg" id="am"></span></div></div>
 <div class="pan"><div class="row"><select id="fs"><option value="">Все статусы</option>${['new','scanning','done','private','dead','error','skip'].map(s=>`<option ${s==flt?'selected':''}>${s}</option>`).join('')}</select><input id="fq" type="search" placeholder="Поиск"></div><div class="tw" id="ct"></div></div>`;
 $('#add').onclick=async()=>{try{const r=await api('/api/admin/chats',{method:'POST',body:{text:$('#ln').value}});$('#am').textContent=`Найдено ссылок: ${r.found}, новых: ${r.new}`;$('#ln').value='';list()}catch(e){$('#am').textContent=e}};
 $('#ds').onclick=async()=>{await api('/api/admin/discover',{method:'POST'});$('#am').textContent='Поиск запущен, результат смотрите во вкладке «Лог»'};$('#fs').onchange=e=>{flt=e.target.value;list()};$('#fq').oninput=()=>list();list();
}
const prog=c=>c.backfilled?'100%':c.cursor&&c.last_msg_id?Math.max(0,Math.round((1-c.cursor/c.last_msg_id)*100))+'%':'0%';
async function list(){
 const r=await api(`/api/admin/chats?status=${flt}&q=${encodeURIComponent($('#fq').value)}`);
 $('#ct').innerHTML=`<table><tr><th>Чат</th><th>Уч.</th><th>Статус</th><th>История</th><th>Скан</th><th></th></tr>${r.map(c=>`<tr><td><a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.title||c.link)}</a>${c.error?`<div class="meta">${esc(c.error)}</div>`:''}</td><td>${fmt(c.members)}</td><td><span class="st ${c.status}">${c.status}</span></td><td>${prog(c)}</td><td>${date(c.last_scanned_at)}</td>
 <td style="white-space:nowrap"><button class="btn g s" data-r="${c.id}">Скан</button> <button class="btn d s" data-d="${c.id}">Удалить</button></td></tr>`).join('')}</table>`;
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await api(`/api/admin/chats/${b.dataset.r}/rescan`,{method:'POST'});list()});
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Удалить чат из базы?')){await api(`/api/admin/chats/${b.dataset.d}`,{method:'DELETE'});list()}});
}
function tAcc(o){
 $('#tb').innerHTML=`<div class="pan"><div class="tw"><table><tr><th>Аккаунт</th><th>Статус</th><th>Flood до</th><th></th></tr>${o.sessions.map(s=>`<tr><td>${esc(s.label)}<div class="meta">${esc(s.phone)}</div></td><td><span class="st ${s.status=='active'?'done':'dead'}">${s.status}</span></td><td>${date(s.flood_until)}</td><td><button class="btn d s" data-x="${s.id}">Удалить</button></td></tr>`).join('')||'<tr><td>Аккаунтов нет</td></tr>'}</table></div></div>
 <div class="pan"><h2 style="font-size:18px">Войти в новый аккаунт</h2><div class="row" style="margin-top:12px"><input id="ph" placeholder="+380..."><input id="lb" placeholder="Название (необязательно)"><button class="btn" id="sc">Получить код</button></div>
 <div class="row"><input id="cd" placeholder="Код из Telegram"><input id="pw" type="password" placeholder="Пароль 2FA, если есть"><button class="btn" id="sl">Войти</button></div><p class="msg" id="sm"></p>
 <label>Или вставьте готовую StringSession</label><textarea id="ss" rows="2" style="width:100%"></textarea><div class="row" style="margin-top:10px"><button class="btn g" id="si">Импортировать</button></div></div>`;
 const m=t=>$('#sm').textContent=t,run=async(f,ok)=>{try{m('...');const r=await f();if(r?.result=='need_password')return m('Нужен пароль 2FA');m(ok);if(r?.result=='ok')adm()}catch(e){m(e)}};
 $('#sc').onclick=()=>run(()=>api('/api/admin/session/code',{method:'POST',body:{phone:$('#ph').value}}),'Код отправлен в Telegram');
 $('#sl').onclick=()=>run(()=>api('/api/admin/session/login',{method:'POST',body:{phone:$('#ph').value,code:$('#cd').value,password:$('#pw').value,label:$('#lb').value}}),'Готово');
 $('#si').onclick=()=>run(()=>api('/api/admin/session/import',{method:'POST',body:{string_session:$('#ss').value,label:$('#lb').value}}),'Готово');
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('Удалить аккаунт?')){await api(`/api/admin/session/${b.dataset.x}`,{method:'DELETE'});adm()}});
}
function tSet(o){
 const F=[['api_id','API ID (my.telegram.org)'],['api_hash','API Hash'],['vz_regex','Строгий фильтр ВЗ (регулярка, ставит метку ВЗ)'],['kw_regex','Широкий фильтр (регулярка)'],['slice','Сообщений за один заход'],['rescan_hours','Проверять новые сообщения раз в, ч'],['delay','Пауза между заходами, с'],['search_limit','Постов на запрос в глобальном поиске'],['search_hours','Автопоиск новых чатов раз в, ч']],B=[['require_kw','Брать ссылки только из сообщений по фильтрам (иначе — все t.me-ссылки)'],['join_private','Вступать в закрытые чаты, чтобы читать их'],['leave_after','Выходить из чата, когда история прочитана']];
 $('#tb').innerHTML=`<div class="pan">${F.map(([k,l])=>`<label>${l}</label><input data-k="${k}" style="width:100%" value="${esc(o.settings[k])}">`).join('')}
 <label>Поисковые запросы (по одному на строке)</label><textarea data-k="search_queries" rows="6" style="width:100%"></textarea><label>@упоминания</label><select data-k="mentions" style="width:100%"><option value="0">Не брать</option><option value="kw">Из сообщений по широкому фильтру</option><option value="1">Из всех сообщений</option></select>${B.map(([k,l])=>`<label style="display:flex;gap:8px;color:var(--ink);align-items:center"><input type="checkbox" data-c="${k}" ${o.settings[k]=='1'?'checked':''} style="min-width:0"> ${l}</label>`).join('')}
 <div class="row" style="margin-top:14px"><button class="btn" id="sv">Сохранить</button><span class="msg" id="svm"></span></div></div>`;
 $('[data-k=mentions]').value=o.settings.mentions;$('[data-k=search_queries]').value=o.settings.search_queries;$('#sv').onclick=async()=>{const b={};document.querySelectorAll('[data-k]').forEach(i=>b[i.dataset.k]=i.value);document.querySelectorAll('[data-c]').forEach(i=>b[i.dataset.c]=i.checked?'1':'0');
  try{await api('/api/admin/settings',{method:'PUT',body:b});$('#svm').textContent='Сохранено'}catch(e){$('#svm').textContent=e}};
}
const route=()=>location.hash=='#admin'?adm():pub();onhashchange=route;route();
</script></body></html>
